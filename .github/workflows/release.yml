name: Release

# Builds the macOS universal app and dmg and the Linux deb, rpm and AppImage for x86_64 and arm64
# with Roost's shared release-app.yml (D-H09). A tag `v*` publishes a draft release with every
# package; a manual run only uploads the packages as workflow artifacts. See docs/RELEASING.md.
#
# The macOS app is always signed, with the first of:
#   1. A Developer ID certificate, notarised: APPLE_CERTIFICATE (base64 .p12),
#      APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD
#      (app-specific password), APPLE_TEAM_ID. Gatekeeper opens it without a warning.
#   2. A self-signed certificate: SELF_SIGNED_CERTIFICATE (base64 .p12) and
#      SELF_SIGNED_CERTIFICATE_PASSWORD. Gatekeeper warns once; the keychain keeps trusting
#      the app across updates.
#   3. Ad hoc. Gatekeeper warns once; the keychain asks again after every update.
#
# In-app updates (FR-9.2) need TAURI_SIGNING_PRIVATE_KEY (and TAURI_SIGNING_PRIVATE_KEY_PASSWORD
# if the key has one; unset, it is an empty password). With it, every bundle is signed for the updater and the release gets a
# `latest.json`. A tag build fails without it, since installed copies could not update from it.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    uses: akyrey/roost/.github/workflows/release-app.yml@v0.1.1
    with:
      roost-ref: v0.1.1
      app-dir: apps/desktop
      product-name: Whimbrel
      binary-name: whimbrel
    secrets:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      SELF_SIGNED_CERTIFICATE: ${{ secrets.SELF_SIGNED_CERTIFICATE }}
      SELF_SIGNED_CERTIFICATE_PASSWORD: ${{ secrets.SELF_SIGNED_CERTIFICATE_PASSWORD }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
