name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Roost is used by tag, not linked (scripts/link-roost.sh)
        run: |
          if grep -nE '^roost-[a-z]+ = \{ path' Cargo.toml || grep -n '"link:' apps/desktop/package.json; then
            echo "::error::A linked Roost was committed; run scripts/unlink-roost.sh"; exit 1
          fi
      - name: Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      # generate_context! needs the frontend's dist folder to exist.
      - run: mkdir -p apps/desktop/dist
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace
      - name: Coverage per crate (80% lines; the app crate is Tauri glue, as in Dunlin)
        run: |
          for crate in wbl-core wbl-http wbl-format wbl-store wbl-auth wbl-openapi wbl-interop wbl-engine; do
            cargo llvm-cov --package "$crate" --all-features --fail-under-lines 80 --summary-only
          done
      - name: TypeScript bindings are up to date
        run: cargo test -p whimbrel --lib bindings

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
