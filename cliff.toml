# git-cliff: drafts a CHANGELOG.md section from the conventional commits since the last tag.
# scripts/release.sh runs it; see docs/RELEASING.md. Only user-facing commits are listed:
# feat → Added, perf → Changed, fix → Fixed. Edit the draft before committing it.

[changelog]
header = ""
# One release only (`--unreleased --tag vX.Y.Z`), in Keep a Changelog form. The HTML comments
# order the groups and are stripped.
body = """
## [{{ version | trim_start_matches(pat="v") }}] - {{ now() | date(format="%Y-%m-%d") }}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.breaking %}**Breaking:** {% endif %}{{ commit.message | split(pat="\n") | first | trim | upper_first }}
{%- endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
filter_commits = true
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^perf", group = "<!-- 1 -->Changed" },
  { message = "^fix", group = "<!-- 2 -->Fixed" },
]
