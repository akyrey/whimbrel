[workspace]
resolver = "3"
members = [
    "crates/wbl-core",
    "crates/wbl-http",
    "crates/wbl-format",
    "crates/wbl-store",
    "crates/wbl-auth",
    "crates/wbl-openapi",
    "crates/wbl-interop",
    "crates/wbl-engine",
    "crates/wbl-mcp",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.6.1"
edition = "2024"
rust-version = "1.90"
license = "MIT"
publish = false

[workspace.dependencies]
wbl-core = { path = "crates/wbl-core" }
wbl-http = { path = "crates/wbl-http" }
wbl-format = { path = "crates/wbl-format" }
wbl-store = { path = "crates/wbl-store" }
wbl-auth = { path = "crates/wbl-auth" }
wbl-openapi = { path = "crates/wbl-openapi" }
wbl-interop = { path = "crates/wbl-interop" }
wbl-engine = { path = "crates/wbl-engine" }
wbl-mcp = { path = "crates/wbl-mcp" }
# The kit shared with Dunlin (D-H09). scripts/link-roost.sh points these at a local checkout.
roost-keychain = { git = "https://github.com/akyrey/roost", tag = "v0.1.4" }
roost-shell = { git = "https://github.com/akyrey/roost", tag = "v0.1.4" }

rstest = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
ts-rs = "12"
uuid = { version = "1", features = ["v4", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

# Tauri recommends these for small release binaries.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
