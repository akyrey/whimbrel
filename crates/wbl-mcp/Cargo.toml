[package]
name = "wbl-mcp"
description = "Whimbrel's MCP server: collections, environments and sends for AI tools (D-H23)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
wbl-core.workspace = true
wbl-format.workspace = true
wbl-engine.workspace = true
wbl-http.workspace = true
wbl-auth.workspace = true
wbl-openapi.workspace = true
wbl-interop.workspace = true
roost-keychain.workspace = true
rmcp = { version = "3.11", features = ["server", "transport-io", "macros", "schemars"] }
schemars = "1"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio-util = "0.7"
tokio = { workspace = true, features = ["io-std"] }

[dev-dependencies]
rmcp = { version = "3.11", features = ["client", "server", "transport-io", "macros", "schemars"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "io-std"] }

[lints]
workspace = true
