swagger: "2.0"
info: {title: Swagger Petstore, version: 1.0.6}
host: petstore.swagger.io
basePath: /v2
schemes: [https, http]
consumes: [application/json]
produces: [application/json, application/xml]
tags:
  - {name: pet, description: Everything about your Pets}
paths:
  /pet:
    post:
      tags: [pet]
      operationId: addPet
      summary: Add a new pet to the store
      parameters:
        - {in: body, name: body, required: true, schema: {$ref: "#/definitions/Pet"}}
      responses:
        "405": {description: Invalid input}
      security: [{petstore_auth: [write:pets, read:pets]}]
  /pet/findByStatus:
    get:
      tags: [pet]
      operationId: findPetsByStatus
      parameters:
        - name: status
          in: query
          required: true
          type: array
          items: {type: string, enum: [available, pending, sold], default: available}
          collectionFormat: multi
      responses:
        "200":
          description: successful operation
          schema: {type: array, items: {$ref: "#/definitions/Pet"}}
  /pet/{petId}/uploadImage:
    parameters:
      - {$ref: "#/parameters/petId"}
    post:
      tags: [pet]
      operationId: uploadFile
      consumes: [multipart/form-data]
      parameters:
        - {name: additionalMetadata, in: formData, type: string}
        - {name: file, in: formData, type: file, required: true}
      responses:
        "200": {$ref: "#/responses/Ok"}
  /store/inventory:
    get:
      operationId: getInventory
      produces: [application/json]
      parameters:
        - {name: tags, in: query, type: array, items: {type: string}, collectionFormat: csv}
      responses:
        "200":
          description: ok
          schema: {type: object, additionalProperties: {type: integer, format: int32}}
          examples:
            application/json: {available: 3}
      security: [{api_key: []}]
parameters:
  petId: {name: petId, in: path, required: true, type: integer, format: int64}
responses:
  Ok: {description: All good, schema: {$ref: "#/definitions/ApiResponse"}}
securityDefinitions:
  petstore_auth:
    type: oauth2
    authorizationUrl: https://petstore.swagger.io/oauth/authorize
    flow: implicit
    scopes: {write:pets: modify pets, read:pets: read pets}
  api_key: {type: apiKey, name: api_key, in: header}
  basic: {type: basic}
definitions:
  Pet:
    type: object
    required: [name, photoUrls]
    properties:
      id: {type: integer, format: int64}
      category: {$ref: "#/definitions/Category"}
      name: {type: string, example: doggie}
      photoUrls: {type: array, items: {type: string}}
      status: {type: string, enum: [available, pending, sold]}
  Category:
    type: object
    properties:
      id: {type: integer, format: int64}
      name: {type: string}
  ApiResponse:
    type: object
    properties:
      code: {type: integer, format: int32}
      message: {type: string}
