openapi: 3.0.3
info:
  title: Users
  version: 2
  description: Users and their teams.
servers:
  - url: https://{region}.api.example.com/{basePath}
    description: Production
    variables:
      region: {default: eu, enum: [eu, us]}
      basePath: {default: v2}
  - url: http://localhost:8080/v2
    description: Local
tags:
  - {name: users}
paths:
  /users:
    get:
      tags: [users]
      operationId: listUsers
      parameters:
        - {name: limit, in: query, schema: {type: integer, default: 20, minimum: 1}}
        - {name: role, in: query, required: true, schema: {type: string, enum: [admin, member]}}
        - {name: ids, in: query, style: form, explode: false, schema: {type: array, items: {type: integer}}}
        - {name: X-Trace, in: header, schema: {type: string, format: uuid}}
        - {name: session, in: cookie, schema: {type: string}}
      responses:
        "200":
          description: The users
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/User"}}
    post:
      tags: [users]
      operationId: createUser
      requestBody:
        $ref: "#/components/requestBodies/NewUser"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/User"}
              examples:
                admin: {value: {id: 1, name: Ada, email: ada@example.com, role: admin}}
          links:
            GetUser: {operationId: getUser, parameters: {userId: "$response.body#/id"}}
      callbacks:
        onCreated:
          "{$request.body#/callbackUrl}":
            post:
              requestBody: {content: {application/json: {schema: {type: object}}}}
              responses: {"200": {description: ok}}
  /users/{userId}:
    parameters:
      - {name: userId, in: path, required: true, schema: {type: integer}, example: 42}
    get:
      tags: [users]
      operationId: getUser
      responses:
        "200":
          description: The user
          content:
            application/json: {schema: {$ref: "#/components/schemas/User"}}
        default: {$ref: "#/components/responses/Error"}
components:
  requestBodies:
    NewUser:
      required: true
      content:
        application/json:
          schema: {$ref: "#/components/schemas/NewUser"}
          examples:
            admin:
              summary: An admin
              value: {name: Ada, email: ada@example.com, role: admin}
            member:
              value: {name: Grace, email: grace@example.com, role: member}
  responses:
    Error:
      description: Something went wrong
      content:
        application/json: {schema: {$ref: "#/components/schemas/Error"}}
  schemas:
    NewUser:
      type: object
      required: [name, email]
      properties:
        name: {type: string, example: Ada}
        email: {type: string, format: email}
        role: {type: string, enum: [admin, member], default: member}
        team: {$ref: "#/components/schemas/Team"}
    User:
      allOf:
        - $ref: "#/components/schemas/NewUser"
        - type: object
          required: [id]
          properties:
            id: {type: integer, format: int64}
            nickname: {type: string, nullable: true}
    Team:
      type: object
      properties:
        name: {type: string}
        members: {type: array, items: {$ref: "#/components/schemas/User"}}
    Error:
      type: object
      properties:
        message: {type: string}
  securitySchemes:
    bearer: {type: http, scheme: bearer, bearerFormat: JWT}
    cc:
      type: oauth2
      flows:
        clientCredentials: {tokenUrl: https://auth.example.com/token, scopes: {users:read: read}}
security: [{bearer: []}]
