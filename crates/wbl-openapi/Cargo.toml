[package]
name = "wbl-openapi"
description = "Reads OpenAPI 2.0 to 3.2 into one model, and generates Whimbrel collections from it"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
ts = ["dep:ts-rs", "wbl-core/ts", "wbl-format/ts"]

[dependencies]
wbl-core.workspace = true
wbl-format.workspace = true
jsonschema = { version = "0.61", default-features = false }
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror.workspace = true
ts-rs = { workspace = true, optional = true, features = ["serde-json-impl"] }
toml_edit = "0.25"
url = "2.5"
yaml-rust2 = "0.13"

[dev-dependencies]
insta = { version = "1", features = ["json"] }
tempfile.workspace = true
tokio = { workspace = true }

[lints]
workspace = true
