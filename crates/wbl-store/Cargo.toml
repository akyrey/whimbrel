[package]
name = "wbl-store"
description = "Whimbrel's local data: request history (SQLite in the app's data folder)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
ts = ["dep:ts-rs", "wbl-core/ts", "wbl-http/ts"]

[dependencies]
wbl-core.workspace = true
wbl-http.workspace = true
rusqlite = { version = "0.42", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ts-rs = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
