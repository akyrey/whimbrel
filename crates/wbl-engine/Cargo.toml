[package]
name = "wbl-engine"
description = "Whimbrel's send pipeline without the app: variables, secrets, auth, checks and the runner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
ts = ["dep:ts-rs", "wbl-core/ts", "wbl-http/ts", "wbl-format/ts", "wbl-auth/ts"]

[dependencies]
wbl-core.workspace = true
wbl-format.workspace = true
wbl-http.workspace = true
wbl-auth.workspace = true
roost-keychain.workspace = true
secrecy = "0.10"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util = "0.7"
ts-rs = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["net", "io-util"] }

[lints]
workspace = true
